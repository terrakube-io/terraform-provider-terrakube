name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # The tests are Go unit tests against a mocked Terrakube API. They do not run the
  # Terraform CLI, so there is no Terraform version matrix here. The examples job below does.
  test:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          {
            echo '### Test coverage'
            echo
            echo "Total: **$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')** of statements"
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            awk 'NR > 1 { split($1, a, ":"); dir = a[1]; sub(/\/[^\/]+$/, "", dir); stmts[dir] += $2; if ($3 > 0) covered[dir] += $2 } END { for (d in stmts) printf "| %s | %.1f%% |\n", d, 100 * covered[d] / stmts[d] }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"

  # Every example must validate on its own. The examples use ephemeral variables and write-only
  # arguments, so 1.11 is the oldest Terraform and OpenTofu they can run on.
  examples:
    name: Examples (${{ matrix.cli }} ${{ matrix.version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: terraform
            version: '1.11.x'
          - cli: terraform
            version: latest
          - cli: tofu
            version: '1.11.x'
          - cli: tofu
            version: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - run: scripts/validate-examples.sh ${{ matrix.cli }}
