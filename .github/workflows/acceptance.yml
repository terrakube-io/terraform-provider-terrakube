name: Acceptance

# Runs the acceptance tests (TestAcc*) against a real Terrakube.
#
# - Pull requests that change the provider run against the version pinned in
#   scripts/acceptance/versions.json, so a result only changes with the code. Renovate updates the
#   pin when Terrakube releases; the pin is the version the compatibility guide lists.
# - The weekly schedule runs against the latest Terrakube release and, while INCLUDE_PREVIOUS_MINOR
#   is 'true', the latest release of the previous minor, to catch an API change before users report
#   it. A scheduled failure opens an issue, or comments on the open one.
# - A manual run takes explicit versions, or picks them like the schedule.
on:
  pull_request:
    paths:
      - '.github/workflows/acceptance.yml'
      - 'scripts/acceptance.sh'
      - 'scripts/acceptance/**'
      - 'internal/provider/**'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Terrakube versions as a JSON list, e.g. ["2.34.2"]. Empty: pick them like the schedule.'
        required: false
        default: ''
      include_previous_minor:
        description: 'With versions empty: also test the latest release of the previous minor.'
        required: false
        type: boolean
        default: true

permissions: {}

env:
  # Whether the weekly schedule also tests the latest release of the previous minor.
  INCLUDE_PREVIOUS_MINOR: 'true'

jobs:
  versions:
    name: Pick Terrakube versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSIONS: ${{ inputs.versions }}
          # A manual run passes the option; the schedule uses INCLUDE_PREVIOUS_MINOR.
          PREVIOUS: ${{ (inputs.include_previous_minor || (github.event_name == 'schedule' && env.INCLUDE_PREVIOUS_MINOR == 'true')) && 'previous' || '' }}
        run: |
          if [ -n "$INPUT_VERSIONS" ]; then
            versions=$INPUT_VERSIONS
          elif [ "$EVENT" = pull_request ]; then
            versions=$(scripts/acceptance.sh versions pinned)
          else
            versions=$(scripts/acceptance.sh versions latest ${PREVIOUS:+"$PREVIOUS"})
          fi
          echo "Versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Terrakube ${{ matrix.terrakube }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terrakube: ${{ fromJSON(needs.versions.outputs.versions) }}
    env:
      TERRAKUBE_VERSION: ${{ matrix.terrakube }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Start Terrakube
        run: |
          settings="$RUNNER_TEMP/terrakube.env"
          scripts/acceptance.sh up > "$settings"
          # Mask the token before it reaches GITHUB_ENV, so it never shows in a log.
          echo "::add-mask::$(sed -n 's/^TERRAKUBE_TOKEN=//p' "$settings")"
          cat "$settings" >> "$GITHUB_ENV"
          rm "$settings"
      - name: Acceptance tests
        run: make testacc TESTARGS='-run TestAcc'
      - name: Terrakube logs
        if: failure()
        run: scripts/acceptance.sh logs
      - name: Stop Terrakube
        if: always()
        run: scripts/acceptance.sh down

  report:
    name: Report failure
    needs: acceptance
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled acceptance tests failed"
          body="The scheduled acceptance tests against a real Terrakube failed: $RUN_URL"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label area/testing
          fi
